spring:
  application:
    name: lily-on-premise

server:
  # lily-blog-sample(8080), lily-cicd(8090), lily-builder(8070) 와 겹치지 않게
  port: 8060

lily:
  agent:
    # 비우면 프로세스마다 새로 만든다. 컨트롤 플레인이 에이전트를 알아보게 하려면 고정한다
    id: ${AGENT_ID:}
    # 비우면 소켓을 열지 않는다. 로컬에서는 POST /api/jobs 로 같은 파이프라인을 돌린다
    control-plane-url: ${CONTROL_PLANE_URL:}
    # 터널이 붙는 주소. 컨테이너 포트가 아니다. 트래픽 전환은 이 포트의 upstream 만 바꾼다
    proxy-port: ${AGENT_PROXY_PORT:8099}
    blue-port: ${AGENT_BLUE_PORT:18080}
    green-port: ${AGENT_GREEN_PORT:18081}
    # 클라우드 기동 프로브(period 5s × failureThreshold 36)와 같은 예산
    health-timeout-seconds: ${AGENT_HEALTH_TIMEOUT_SECONDS:180}
    # API 자격 없이 이미 만들어 둔 named tunnel 을 쓸 때의 고정 주소
    public-url: ${PUBLIC_URL:}
    workspace: ${AGENT_WORKSPACE:}
    cloudflare:
      enabled: ${CLOUDFLARE_ENABLED:false}
      token: ${CLOUDFLARE_TUNNEL_TOKEN:}
      # 네 값이 모두 있으면 https://{app}.{zone} 을 API 로 만든다. 토큰은 로그에 남기지 않는다
      api-token: ${CLOUDFLARE_API_TOKEN:}
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
      zone-id: ${CLOUDFLARE_ZONE_ID:}
      zone-name: ${CLOUDFLARE_ZONE_NAME:}
    # 클라우드 버스팅: 로컬이 한도를 넘으면 넘치는 요청을 클라우드 Ingress 로 보낸다. 상태는 GET /api/burst
    burst:
      enabled: ${BURST_ENABLED:false}
      builder-url: ${BURST_BUILDER_URL:}
      token: ${BURST_API_TOKEN:}
      ingress-host: ${BURST_INGRESS_HOST:}
      ingress-port: ${BURST_INGRESS_PORT:80}
      # {app} 은 앱 이름. 비우면 {app}.{zone}
      public-host: ${BURST_PUBLIC_HOST:}
      local-limit: ${BURST_LOCAL_LIMIT:8}
      scale-up-after-seconds: ${BURST_SCALE_UP_AFTER_SECONDS:3}
      cooldown-seconds: ${BURST_COOLDOWN_SECONDS:30}
      replicas: ${BURST_REPLICAS:2}
      # 평소에 띄워 둘 클라우드 Pod. 1 이상이면 과부하 때 기동을 기다리지 않고 바로 넘긴다. 0 이면 넘길 때 띄운다
      warm-replicas: ${BURST_WARM_REPLICAS:1}
      database: ${BURST_DATABASE:}
    # 거점 전환: 공개 주소의 CNAME 내용물만 온프레 터널과 이 호스트 사이에서 바꾼다. IP 면 거절한다
    cutover:
      cloud-origin: ${CUTOVER_CLOUD_ORIGIN:}
    # 클라우드 RDS 연동: 배포 요청에 database 가 있으면 SSH 터널로 같은 DB 에 붙인다 (계정은 lily-builder 를 거쳐 받는다)
    database:
      ssh-host: ${DB_TUNNEL_SSH_HOST:}
      ssh-user: ${DB_TUNNEL_SSH_USER:lily-tunnel}
      ssh-key: ${DB_TUNNEL_SSH_KEY:}
      remote-host: ${DB_TUNNEL_REMOTE_HOST:}
      remote-port: ${DB_TUNNEL_REMOTE_PORT:5432}
      bind-host: ${DB_TUNNEL_BIND_HOST:172.17.0.1}
      bind-port: ${DB_TUNNEL_BIND_PORT:15432}
